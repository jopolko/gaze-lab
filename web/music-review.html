<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Afterglow · Music Review</title>
<style>
:root{--bg:#06070c;--panel:#0d1018;--panel2:#121725;--line:#1f2738;--text:#dfe7f5;--dim:#8592a8;
--cyan:#3ee8ff;--green:#5dff9a;--amber:#ffbe4d;--red:#ff6b4a;--blue:#5b8cff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
body{background:radial-gradient(1200px 600px at 80% -10%,#0f2a3a55,transparent),radial-gradient(900px 500px at -10% 10%,#12204a55,transparent),var(--bg);min-height:100vh}
a{color:var(--cyan);text-decoration:none;word-break:break-word}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:#06070ce8;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
padding:calc(10px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
h1{margin:0;font-size:18px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 12px #3ee8ff88}
h1 small{display:block;font-size:11px;letter-spacing:.1em;color:var(--dim);text-shadow:none;text-transform:none;margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
select,button,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px}
select{padding:7px 8px;min-width:0;flex:1 1 130px;max-width:220px}
button{padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--cyan)}
.export{background:#0d2a22;border-color:#1f6b4c;color:var(--green);font-weight:600}
.count{color:var(--dim);font-size:13px;flex:1 1 100%}
main{max-width:1100px;margin:0 auto;padding:14px max(12px,env(safe-area-inset-right)) 60px max(12px,env(safe-area-inset-left));
display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.intro{grid-column:1/-1;color:var(--dim);font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.intro b{color:var(--text)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;
display:flex;flex-direction:column;gap:8px;position:relative}
.card.keep{border-color:#2fbf72;box-shadow:0 0 0 1px #2fbf7255,0 0 18px #2fbf7222}
.card.maybe{border-color:#c9922e}
.card.skip{opacity:.45}
.top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.chip{padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.chip.g{color:var(--cyan);border-color:#1d5866}
.lic{background:#0e3322;border-color:#2fbf72;color:var(--green);font-weight:700}
.t{font-size:17px;font-weight:700;margin:0;line-height:1.25;word-break:break-word}
.a{color:var(--amber);font-size:14px;word-break:break-word}
.meta{font-size:12.5px;color:var(--dim);display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.meta span:nth-child(odd){color:#5f6c82}
.meta span{min-width:0;word-break:break-word}
audio{width:100%;height:36px}
.listen{display:block;text-align:center;padding:8px;border:1px dashed #1d5866;border-radius:8px;font-size:13.5px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.credit{font-size:12px;background:#080a10;border:1px solid var(--line);border-radius:8px;padding:7px 8px;color:#b9c4d8;word-break:break-word;position:relative}
.credit button{float:right;margin:-2px -2px 4px 6px;padding:2px 8px;font-size:11px}
.dec{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dec button{padding:8px 4px;font-weight:600}
.dec .k.on{background:#11402a;border-color:#2fbf72;color:var(--green)}
.dec .m.on{background:#3a2a0c;border-color:#c9922e;color:var(--amber)}
.dec .s.on{background:#3a1710;border-color:#a8452f;color:var(--red)}
textarea{width:100%;min-height:38px;resize:vertical;padding:6px 8px;font-size:13px}
#out{position:fixed;inset:auto 10px 10px 10px;z-index:9;background:var(--panel2);border:1px solid var(--green);border-radius:10px;padding:10px;display:none;max-width:700px;margin:0 auto}
#out textarea{min-height:200px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
#out .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;color:var(--green);font-size:13px}
.sig{font-size:13px;color:var(--dim)}.sig b{color:var(--green)}.ep{color:var(--amber);font-size:12.5px}.noep{color:#5f6c82;font-size:12.5px}.top400{color:var(--cyan)}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:40px}
</style>
</head>
<body>
<header>
<h1>Afterglow · Music Review<small>Independent tracks you can ship with attribution only (CC BY / CC0) · Electronic Anesthesia</small></h1>
<div class="bar">
<select id="fg" aria-label="Filter by genre"></select>
<select id="fd" aria-label="Filter by decision">
<option value="all">All decisions</option><option value="none">Undecided</option><option value="keep">Keep</option><option value="maybe">Maybe</option><option value="skip">Skip</option>
</select>
<select id="fs" aria-label="Sort"><option value="plays">Sort: Plays</option><option value="favs">Sort: Favourites</option><option value="ep">Sort: Editors' Picks first</option></select>
<button class="export" id="exp">Export picks</button>
<div class="count" id="count"></div>
</div>
</header>
<main id="list"></main>
<div id="out"><div class="row"><span id="outmsg"></span><button id="close">Close</button></div><textarea id="outtxt" readonly></textarea></div>

 "licUrl": "https://creativecommons.org/licenses/by/4.0/", "licText": "FMA page: Attribution License", "bpm": "", "key": "", "len": "05:12", "year": "2016", "audio": "https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Simon_Mathewson/Notes/Simon_Mathewson_-_04_-_Doline_Dub.mp3", "stems": [], "plays": 5900, "favs": 9, "dls": 569, "chart": false, "ep": {"rank": 1, "label": "Added to FMA by curator WFMU", "url": "https://freemusicarchive.org/curator/WFMU/"}, "ai": "No", "genres": "Electronic, Experimental Pop, Instrumental", "credit": "“Doline Dub” by Simon Mathewson (https://freemusicarchive.org/music/Simon_Mathewson/Notes/04_Doline_Dub/), licensed CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)."}, {"id": "fma-melatonin-dub-tommaso-croce", "genre": "Dub / Reggae", "src": "Free Music Archive", "title": "Melatonin Dub", "artist": "TOMMASO CROCE", "feat": "", "page": "https://freemusicarchive.org/music/Dilating_Times/trianguitar/melatonin-dub/", "contact": "https://freemusicarchive.org/music/Dilating_Times/contact?title=Melatonin+Dub", "contactLabel": "Contact artist (FMA form)", "lic": "CC BY 4.0", "licUrl": "https://creativecommons.org/licenses/by/4.0", "licText": "FMA page: Attribution 4.0 International License", "bpm": "", "key": "", "len": "05:34", "year": "2023", "audio": "https://files.freemusicarchive.org/storage-freemusicarchive-org/tracks/BI4jZX2DNhqEVcO82TF4ZdYz39dtJYcamqA23kxa.mp3", "stems": [], "plays": 2200, "favs": 5, "dls": 74, "chart": false, "ep": {"rank": 0, "label": "", "url": ""}, "ai": "No", "genres": "", "credit": "“Melatonin Dub” by TOMMASO CROCE (https://freemusicarchive.org/music/Dilating_Times/trianguitar/melatonin-dub/), licensed CC BY 4.0 (https://creativecommons.org/licenses/by/4.0)."}, {"id": "fma-generic-sloppy-dub-tommaso-croce", "genre": "Dub / Reggae", "src": "Free Music Archive", "title": "Generic Sloppy Dub", "artist": "TOMMASO CROCE", "feat": "", "page": "https://freemusicarchive.org/music/Dilating_T const KEY='afterglow-music-review-v1';
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const GENRES=[...new Set(TRACKS.map(t=>t.genre))];
const fg=document.getElementById('fg'),fd=document.getElementById('fd'),list=document.getElementById('list');
fg.innerHTML='<option value="all">All genres</option>'+GENRES.map(g=>`<option>${g}</option>`).join('');
const fmt=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?(n/1e3).toFixed(1).replace(/\.0$/,'')+'K':String(n);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function card(t){
  const st=S[t.id]||{};
  const rows=[];
  const add=(k,v)=>{if(v)rows.push(`<span>${k}</span><span>${v}</span>`)};
  add('Licence',`<a href="${esc(t.licUrl)}" target="_blank" rel="noopener">${esc(t.licText)}</a>`);
  add('Length',esc(t.len));
  add('BPM',esc(t.bpm));
  add('Key',esc(t.key));
  add('Feat.',esc(t.feat));
  add('Instrumental','Yes (FMA flag)');
  add('FMA genres',esc(t.genres));
  add('Stems','none listed on FMA');
  add('Source',esc(t.src)+(t.year?' · released '+esc(t.year):'')+' · AI-generated: '+esc(t.ai||'?'));
  const play=`<audio controls preload="none" src="${esc(t.audio)}"></audio>`;
  const na=v=>v==null?'n/a':fmt(v);
  const epb=t.ep&&t.ep.rank?`<a class="ep" href="${esc(t.ep.url)}" target="_blank" rel="noopener">★ Editors' Pick · ${esc(t.ep.label)}</a>`:`<span class="noep">Editors' Pick: none</span>`;
  const sig=`<div class="sig"><b>▶ ${na(t.plays)}</b> plays · <b>♥ ${na(t.favs)}</b> favourites · ${fmt(t.dls)} downloads${t.chart?' · <span class="top400">FMA all-time top 400</span>':''}<br>${epb}</div>`;
  return `<article class="card ${st.d||''}" data-id="${t.id}">
<div class="top"><span class="chip g">${esc(t.genre)}</span><span class="chip lic">${esc(t.lic)}</span><span class="chip">${esc(t.src)}</span></div>
<h2 class="t">${esc(t.title)}</h2><div class="a">${esc(t.artist)}</div>
${sig}
${play}
<div class="meta">${rows.join('')}</div>
<div class="links"><a href="${esc(t.page)}" target="_blank" rel="noopener">Track page ↗</a><a href="${esc(t.contact)}" target="_blank" rel="noopener">${esc(t.contactLabel)} ↗</a></div>
<div class="credit"><button data-copy>Copy</button>${esc(t.credit)}</div>
<div class="dec"><button class="k ${st.d==='keep'?'on':''}" data-d="keep">Keep</button><button class="m ${st.d==='maybe'?'on':''}" data-d="maybe">Maybe</button><button class="s ${st.d==='skip'?'on':''}" data-d="skip">Skip</button></div>
<textarea placeholder="Notes (where it fits, which part loops…)" data-n>${esc(st.n||'')}</textarea>
</article>`;
}
function render(){
  const g=fg.value,d=fd.value;
  const vis=sortT(TRACKS.filter(t=>(g==='all'||t.genre===g)&&(d==='all'||(d==='none'?!(S[t.id]&&S[t.id].d):(S[t.id]&&S[t.id].d===d)))));
  const intro=`<div class="intro"><b>How these were picked:</b> instrumental only (the artist's own “Instrumental: Yes” flag on FMA; anything not flagged is out, even if it may be instrumental), strict genre match on FMA's genre tags, no Latin, surf or novelty. Then ranked by what listeners rate: plays, favourites, and <b>Editors' Pick</b> (★ featured in an FMA Team mix, or added by an FMA curator such as WFMU). Sort below. Missing numbers show “n/a” and sort last. Every licence is CC BY or CC0, checked on the track's own page, and every track plays here. <b>Gaps on FMA:</b> almost no instrumental trance (3 weak tracks), and no jungle tagged with an amen break, so the amen break is unconfirmed for every jungle track. Instrumental heavy dub is thin too (5 tracks, small numbers). Better trance, amen jungle and funk will need other CC sources. Decisions and notes save on this device. <b>Export picks</b> copies your Keeps with credit lines and contact links.</div>`;
  list.innerHTML=intro+(vis.length?vis.map(card).join(''):'<div class="empty">No tracks match.</div>');
  const c={keep:0,maybe:0,skip:0};Object.values(S).forEach(s=>{if(s.d)c[s.d]++});
  document.getElementById('count').textContent=`${vis.length} shown · ${TRACKS.length} total · Keep ${c.keep} · Maybe ${c.maybe} · Skip ${c.skip}`;
}
list.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const el=b.closest('.card'),id=el.dataset.id,t=TRACKS.find(x=>x.id===id);
  if(b.dataset.d){S[id]=S[id]||{};S[id].d=S[id].d===b.dataset.d?'':b.dataset.d;save();
    el.className='card '+(S[id].d||'');el.querySelectorAll('.dec button').forEach(x=>x.classList.toggle('on',x.dataset.d===S[id].d));
    const c={keep:0,maybe:0,skip:0};Object.values(S).forEach(s=>{if(s.d)c[s.d]++});
    document.getElementById('count').textContent=document.getElementById('count').textContent.replace(/Keep \d+ · Maybe \d+ · Skip \d+/,`Keep ${c.keep} · Maybe ${c.maybe} · Skip ${c.skip}`);}
  if(b.hasAttribute('data-copy'))copy(t.credit).then(ok=>{b.textContent=ok?'Copied':'Copy failed';setTimeout(()=>b.textContent='Copy',1500)});
});
list.addEventListener('input',e=>{if(!e.target.hasAttribute('data-n'))return;const id=e.target.closest('.card').dataset.id;S[id]=S[id]||{};S[id].n=e.target.value;save()});
list.addEventListener('play',e=>{document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
const fs=document.getElementById('fs');
function sortT(a){const k=fs.value,v=x=>x==null?-1:x;
  return a.slice().sort((p,q)=>k==='ep'?(v(q.ep&&q.ep.rank)-v(p.ep&&p.ep.rank))||(v(q.plays)-v(p.plays)):k==='favs'?(v(q.favs)-v(p.favs))||(v(q.plays)-v(p.plays)):(v(q.plays)-v(p.plays))||(v(q.favs)-v(p.favs)));}
fg.onchange=fd.onchange=fs.onchange=render;
async function copy(s){try{await navigator.clipboard.writeText(s);return true}catch(e){return false}}
document.getElementById('exp').onclick=async()=>{
  const keep=TRACKS.filter(t=>S[t.id]&&S[t.id].d==='keep');
  const maybe=TRACKS.filter(t=>S[t.id]&&S[t.id].d==='maybe');
  const fmt=t=>[`- [${t.genre}] "${t.title}" by ${t.artist} (${t.src})`,`  Credit: ${t.credit}`,`  Licence: ${t.licText} ${t.licUrl}`,`  Track: ${t.page}`,`  Contact: ${t.contact}`,`  Audio: ${t.audio}`,`  Signal: ${t.plays??'n/a'} plays, ${t.favs??'n/a'} favourites on FMA${t.ep&&t.ep.rank?"; Editors' Pick: "+t.ep.label:''}`,S[t.id].n?`  Notes: ${S[t.id].n}`:''].filter(Boolean).join('\n');
  let txt=`AFTERGLOW MUSIC PICKS (${keep.length} kept)\n\n`+(keep.length?keep.map(fmt).join('\n\n'):'(none kept yet)');
  if(maybe.length)txt+=`\n\nMAYBE (${maybe.length}): `+maybe.map(t=>`"${t.title}" by ${t.artist}`).join('; ');
  const ok=await copy(txt);
  document.getElementById('outmsg').textContent=ok?'Copied to clipboard. Paste it back to Claude.':'Copy blocked. Select the text below and copy it.';
  const ta=document.getElementById('outtxt');ta.value=txt;document.getElementById('out').style.display='block';if(!ok){ta.focus();ta.select()}
};
document.getElementById('close').onclick=()=>document.getElementById('out').style.display='none';
render();
</script>
