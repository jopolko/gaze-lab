<title>Godot level viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

  #bar { position: fixed; left: 0; right: 0; bottom: 10px; text-align: center; color: #ddd; font: 12px ui-monospace, Consolas, monospace; z-index: 5; pointer-events: none; text-shadow: 0 0 4px #000; }
</style>
<script type="importmap">
{ "imports": { "three": "../stargaze/vendor/three/three.module.min.js" } }
</script>
