<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera test</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#111;color:#eee;padding:16px}button{font-size:18px;padding:10px 16px}pre{white-space:pre-wrap;background:#000;padding:12px;border-radius:8px}video{width:240px;margin:6px;background:#222}</style>
<h2>Camera test</h2><p>Tap the button. It lists every camera this browser can see and tries to open each one.</p><button id="go">Test cameras</button><pre id="out"></pre><div id="v"></div>
<script>
const out = document.getElementById('out'); const log = (t) => { out.textContent += t + '\n'; };
document.getElementById('go').onclick = async () => {
  out.textContent = ''; log('browser: ' + navigator.userAgent);
  try { const s = await navigator.mediaDevices.getUserMedia({ video: true }); log('default camera opened: ' + s.getVideoTracks()[0].label); s.getTracks().forEach((t) => t.stop()); } catch (e) { log('default camera FAILED: ' + e.name + ' ' + e.message); }
  let devs = []; try { devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput'); } catch (e) { log('enumerate failed: ' + e.name); }
  log('cameras listed: ' + devs.length);
  for (const d of devs) {
    try { const s = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: d.deviceId } } }); const v = document.createElement('video'); v.autoplay = true; v.muted = true; v.playsInline = true; v.srcObject = s; document.getElementById('v').appendChild(v); log('OK     ' + (d.label || '(no name)') + '  id=' + d.deviceId.slice(0, 8)); }
    catch (e) { log('FAILED ' + (d.label || '(no name)') + '  ' + e.name + ': ' + e.message); }
  }
};
</script>
