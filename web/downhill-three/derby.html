<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0716">
<title>Smash Derby</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0716; overflow: hidden; font-family: ui-rounded, "SF Pro Rounded", system-ui, "Segoe UI", sans-serif; color: #fff; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
  .abs { position: absolute; }
  .btn { pointer-events: auto; cursor: pointer; user-select: none; touch-action: manipulation; display: flex; align-items: center; justify-content: center; min-height: 46px; min-width: 46px; box-sizing: border-box; padding: 10px 20px; border-radius: 40px; font: 900 clamp(14px, 3.6vw, 19px) system-ui, sans-serif; letter-spacing: .08em; color: #fff; border: 2px solid #ffffff66; background: #ffffff14; text-align: center; }
  .btn.hot { background: linear-gradient(90deg, #ff2fa0, #ff9a1f); border-color: #fff; }
  .btn.cool { background: linear-gradient(90deg, #19e6ff, #8a2dff); border-color: #fff; }
  .card { pointer-events: auto; width: min(560px, 94vw); max-height: 96vh; box-sizing: border-box; padding: clamp(12px, 3vh, 26px) clamp(14px, 4vw, 30px); border-radius: 26px; background: linear-gradient(160deg, #1a0838ee, #07020fe8); border: 2px solid #ffffff44; box-shadow: 0 0 60px #ff2fa066, inset 0 0 40px #19e6ff22; text-align: center; display: flex; flex-direction: column; gap: clamp(8px, 2vh, 16px); align-items: center; }
  .title { font: 900 clamp(34px, 11vw, 72px) system-ui, sans-serif; line-height: .95; letter-spacing: .03em; background: linear-gradient(90deg, #ff2fa0, #ffd23a, #19e6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 0 14px #ff2fa099); }
  .sub { font: 700 clamp(13px, 3.4vw, 18px)/1.3 system-ui, sans-serif; color: #e6dcff; max-width: 40ch; text-wrap: balance; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .tiny { font: 600 12px ui-monospace, Menlo, Consolas, monospace; color: #a9a3c4; letter-spacing: .06em; }
  .bar { height: 10px; border-radius: 6px; background: #ffffff22; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; border-radius: 6px; transition: width .12s; }
  #call { position: absolute; left: 0; right: 0; top: 22%; text-align: center; font: 900 clamp(30px, 9vw, 76px) system-ui, sans-serif; letter-spacing: .04em; text-shadow: 0 0 18px currentColor, 0 4px 0 #0009; opacity: 0; transform: scale(.6); pointer-events: none; padding: 0 3vw; text-wrap: balance; }
  #call.go { animation: pop 1.5s ease-out both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4) rotate(-3deg); } 12% { opacity: 1; transform: scale(1.12) rotate(1deg); } 24% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05) translateY(-14px); } }
  .arrow { position: absolute; width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 18px solid #fff; margin: -9px 0 0 -9px; opacity: .9; filter: drop-shadow(0 0 4px #000); }
  .feed { font: 700 clamp(11px, 2.8vw, 14px) system-ui, sans-serif; text-shadow: 0 0 4px #000, 0 0 2px #000; white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "../stargaze/vendor/three/three.module.min.js" } }
</script>
<link rel="modulepreload" href="../stargaze/vendor/three/three.module.min.js">
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script type="module" src="derby.js"></script>
</body>
</html>
