<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DOWNHILL (three.js)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; font-family: ui-monospace, Consolas, monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; left: 8px; top: 8px; color: #9ff; font-size: 13px; line-height: 1.35; white-space: pre; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 7px #000; pointer-events: none; z-index: 5; }
  #help { position: fixed; left: 8px; bottom: 64px; color: #fff9; font-size: 12px; pointer-events: none; z-index: 5; }
  #msg { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; z-index: 7; background: rgba(0,0,0,.55); }
  #msg h1 { margin: 0 0 12px; font-weight: 300; letter-spacing: .25em; font-size: clamp(28px, 7vw, 64px); text-transform: uppercase; }
  #msg p { margin: 0 0 22px; opacity: .8; font-size: clamp(14px, 3vw, 22px); }
  #msg button { font: inherit; color: #fff; padding: 16px 44px; border: 2px solid #0ff; border-radius: 999px; background: rgba(0,255,255,.15); font-size: clamp(16px, 4vw, 24px); letter-spacing: .2em; cursor: pointer; }
  #zones { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; display: none; z-index: 4; pointer-events: none; }
  #zones div { position: absolute; top: 0; bottom: 0; width: 33.33%; border-top: 3px solid #fff3; color: #fff6; text-align: center; line-height: 56px; letter-spacing: .3em; font-size: 14px; }
  #zones div.on { background: linear-gradient(#0ff4, transparent); border-top-color: #0ff; color: #fff; }
  #zones div.tg { border-top: 8px solid #ff0; background: linear-gradient(#ff04, transparent); color: #ff0; }
  #zones div.zn { box-shadow: inset 0 0 0 3px #fff; }
  #zones div.on.tg { border-top-color: #0f8; background: linear-gradient(#0f86, transparent); color: #fff; }
  #zones div.on:not(.tg) { border-top-color: #f44; background: linear-gradient(#f444, transparent); }
  #gdot { position: fixed; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid #ff0; z-index: 6; display: none; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": { "three": "../stargaze/vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"></div>
<div id="gdot"></div>
<div id="zones"><div style="left:0">LEFT</div><div style="left:33.33%">MIDDLE</div><div style="left:66.66%">RIGHT</div></div>
<div id="msg"><h1 id="mh"></h1><p id="mp"></p><button id="mb"></button></div>
<div id="help">Three lanes: the board follows your eyes (left, middle, right). A lane you pick is held until you pass it. Rocks hide in some rows. G = eye gauge. Esc pauses  N next world  M music  ?world=candy  ?fast  ?nomusic  ?mouse</div>
<script type="module" src="./main.js?v=1795099085"></script>
</body>
</html>
