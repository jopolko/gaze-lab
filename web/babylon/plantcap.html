<!doctype html><html><head><meta charset="utf-8"><title>Plant turntables</title>
<style>html,body{margin:0;background:#1a1222}canvas{display:block}</style>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.0.0/babylon.js"></script><script src="plants3d.js"></script></head><body>
<canvas id="c" width="320" height="320" style="width:320px;height:320px"></canvas>
<script>
/* Tool page: renders each 3D plant as a turntable sprite sheet for the title screen (32 frames, 8 x 4, 320 px each, transparent).
   ?grid shows all eight at once for a look. window.__sheet(name) -> PNG data URL. */
const cv = document.getElementById('c'), B = BABYLON, eng = new B.Engine(cv, true, { preserveDrawingBuffer: true, premultipliedAlpha: false, alpha: true });
const scene = new B.Scene(eng); scene.clearColor = new B.Color4(0, 0, 0, 0);
const cam = new B.ArcRotateCamera('cam', Math.PI / 2, Math.PI / 2.15, 6.2, new B.Vector3(0, 0, 0), scene); cam.fov = .42;
const hl = new B.HemisphericLight('h', new B.Vector3(.2, 1, .4), scene); hl.intensity = .85; hl.groundColor = new B.Color3(.35, .3, .4);
const dl = new B.DirectionalLight('d', new B.Vector3(-.5, -.6, -1), scene); dl.intensity = .9;
const Q = new URLSearchParams(location.search);
if (Q.has('grid')) { AGPLANT3D.list.forEach((n, i) => { const R = AGPLANT3D.build(B, scene, n, { lit: true }); R.position.set((i % 4 - 1.5) * 2.6, i < 4 ? 1.3 : -1.3, 0); R.rotation.y = .5; }); cam.radius = 16; cam.fov = .6; cv.width = cv.height = 900; cv.style.width = cv.style.height = '900px'; eng.resize(); }
eng.runRenderLoop(() => scene.render());
window.__sheet = async (name, N = 32, cols = 8, S = 320) => { eng.stopRenderLoop(); for (const m of scene.transformNodes.slice()) m.dispose(); for (const m of scene.meshes.slice()) m.dispose();
  const R = AGPLANT3D.build(B, scene, name, { lit: true }); await scene.whenReadyAsync(); for (let k = 0; k < 6; k++) { scene.render(); await new Promise((r) => requestAnimationFrame(r)); } const sh = document.createElement('canvas'); sh.width = cols * S; sh.height = Math.ceil(N / cols) * S; const g = sh.getContext('2d');
  for (let i = 0; i < N; i++) { R.rotation.y = i / N * Math.PI * 2; scene.render(); g.drawImage(cv, (i % cols) * S, Math.floor(i / cols) * S, S, S); }
  return sh.toDataURL('image/png'); };
</script></body></html>
