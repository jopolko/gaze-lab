<style>
/* The main menu, neo-noir: Play (continue, the eight levels as lit cards over a still from each world, the journey) and Upgrades (gear tier II), links to the tutorial and the character editor.
   One screen, never scrolls: everything scales to fit, landscape (4 x 2) or portrait (2 x 4). Every text sits on a dark veil, so no colour ever melts into the picture.

:root { --bg:#05070c; --line:rgba(56,232,255,.26); --fg:#f4f1ea; --dim:#b9c2d4; --sea:#38e8ff; --gold:#ffd23a; --silver:#dfe6f2; --bronze:#e8a86a; --tt:"Bebas Neue","Barlow Condensed",Impact,"Arial Narrow",sans-serif; --lb:"Barlow Condensed","Arial Narrow",sans-serif; color-scheme:dark; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:600 clamp(13px,1.5vmin + 7px,18px)/1.3 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
body { background:radial-gradient(ellipse at 50% 130%, #1b1030 0%, #0a0d16 50%, #040508 100%); padding:max(10px, var(--sa-top, env(safe-area-inset-top,0px))) max(14px, var(--sa-right, env(safe-area-inset-right,0px))) max(10px, var(--sa-bottom, env(safe-area-inset-bottom,0px))) max(14px, var(--sa-left, env(safe-area-inset-left,0px))); display:flex; flex-direction:column; gap:1.3vmin; }

.tag { color:var(--dim); font:italic 500 clamp(12px,1.6vmin + 4px,16px) Georgia,serif; }
.sh { margin-left:auto; display:flex; align-items:center; gap:.4em; font:700 clamp(15px,2.4vmin,22px) var(--lb); letter-spacing:.1em; color:#9fe8ff; background:rgba(10,14,24,.85); border:1px solid var(--line); border-radius:999px; padding:.2em .8em; }

button:focus-visible, a:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }

.lv, .card { position:relative; overflow:hidden; border-radius:14px; border:1px solid rgba(255,255,255,.09); background:#04060a; padding:0; text-align:left; color:var(--fg); font:inherit; min-height:0; cursor:pointer; isolation:isolate; }

.qs { display:flex; gap:3px; flex-wrap:wrap; margin-top:.15em; } .qs i { font-style:normal; font-size:clamp(10px,1.2vmin + 4px,14px); line-height:1; opacity:.3; filter:grayscale(1); } .qs i.on { opacity:1; filter:none; }

.lv.s-open .art { filter:saturate(.85) contrast(1.1) brightness(.68); }
.lv.s-lock { cursor:default; } .lv.s-lock .art { filter:grayscale(1) contrast(1.15) brightness(.26); } .lv.s-lock .txt b { color:#c9d0dc; } .lv.s-lock .chip { color:#c9d0dc; }
.lv:not(.s-lock):hover .art { transform:scale(1.04); }
.m-GOLD { color:var(--gold)!important; border-color:rgba(255,210,58,.6)!important; } .m-SILVER { color:var(--silver)!important; border-color:rgba(223,230,242,.5)!important; } .m-BRONZE { color:var(--bronze)!important; border-color:rgba(232,168,106,.55)!important; } .m-CLEARED { color:#9fe8ff!important; border-color:var(--line)!important; }
.up { flex:1; min-height:0; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:1.2vmin; }

.card .btn { align-self:flex-start; font-size:clamp(13px,1.6vmin + 5px,18px); }
.uphint { color:#cfe9ff; font:700 clamp(13px,1.5vmin + 6px,18px) var(--lb); letter-spacing:.06em; }
.uphint b { color:var(--gold); }
.cx { flex:1; min-height:0; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); grid-template-rows:repeat(2, minmax(0,1fr)); gap:1.2vmin; }
.st { position:relative; overflow:hidden; border-radius:14px; border:1px solid rgba(255,255,255,.1); background:radial-gradient(ellipse at 50% 35%, rgba(var(--sc),.16), #05070c 70%); color:var(--fg); font:inherit; text-align:left; padding:0; min-height:0; cursor:pointer; }
.st canvas { position:absolute; left:0; top:0; width:100%; height:66%; }
.st .txt b { font-size:clamp(16px,2.6vmin,30px); letter-spacing:.03em; }
.st.off { cursor:default; } .st.off .txt b { color:#8a93a6; }
.st.off canvas { filter:brightness(0) drop-shadow(0 0 1px rgba(255,255,255,.4)); opacity:.7; }
#sdet { position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; background:rgba(3,4,8,.84); padding:max(14px,var(--sa-top, env(safe-area-inset-top,0px))) max(14px,var(--sa-right, env(safe-area-inset-right,0px))) max(14px,var(--sa-bottom, env(safe-area-inset-bottom,0px))) max(14px,var(--sa-left, env(safe-area-inset-left,0px))); }
#sdet .box { position:relative; width:min(780px,100%); max-height:100%; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.35fr); gap:1.4vmin 2.4vmin; align-items:center; background:#070a12; border:1px solid rgba(var(--sc),.55); border-radius:16px; box-shadow:0 0 40px rgba(var(--sc),.2); padding:2.2vmin 2.6vmin; overflow:hidden; }
#sdet canvas { width:100%; aspect-ratio:1; max-height:56vh; }
#sdet .rar { font:700 clamp(12px,1.4vmin + 5px,16px) var(--lb); letter-spacing:.16em; text-transform:uppercase; color:rgb(var(--sc)); }
#sdet h2 { margin:.1em 0 .15em; font:400 clamp(24px,4.6vmin,46px)/.95 var(--tt); letter-spacing:.04em; color:#fff; overflow-wrap:anywhere; }
#sdet .sys { color:#aeb7c9; font:italic 500 clamp(11px,1.1vmin + 6px,15px)/1.25 Georgia,serif; overflow-wrap:anywhere; }
#sdet p { margin:.55em 0 0; font:600 clamp(12px,1.2vmin + 6px,16px)/1.3 system-ui,sans-serif; color:#e3e8f2; }
#sdet p.acc { color:#ffd9a8; } #sdet p.wild { color:#cfe9ff; font-style:italic; }
#sdet .x { position:absolute; right:.4em; top:.3em; background:none; border:0; color:#cfd6e4; font:700 28px/1 var(--lb); cursor:pointer; padding:.1em .3em; }
.cxhint { color:#cfe9ff; font:700 clamp(13px,1.5vmin + 6px,18px) var(--lb); letter-spacing:.06em; }
@media (orientation:portrait) { .cx { grid-template-columns:repeat(2, minmax(0,1fr)); grid-template-rows:repeat(4, minmax(0,1fr)); } #sdet .box { grid-template-columns:1fr; } #sdet canvas { height:28vh; width:auto; justify-self:center; } }
[hidden] { display:none !important; }
@media (orientation:portrait) { .grid { grid-template-columns:repeat(2, minmax(0,1fr)); grid-template-rows:repeat(4, minmax(0,1fr)); } .up { grid-template-columns:repeat(2, minmax(0,1fr)); grid-template-rows:repeat(2, minmax(0,1fr)); } .tag { display:none; } .txt b { font-size:clamp(20px,5vmin,36px); } }
.card.upc{display:flex;flex-direction:column}.card.upc .upst{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 55%,#24304d,#090c14 75%);padding:6% 8% 2%}
.card.upc .upst .art{z-index:auto!important;position:static!important;width:100%;height:100%;max-height:100%;object-fit:contain!important;object-position:50% 50%!important;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.card.upc .veil{display:none}.card.upc .txt{position:relative!important;inset:auto!important;flex:0 0 auto;background:linear-gradient(180deg,rgba(9,12,20,.6),#090c14);padding:8px 12px 12px}
@media (orientation:landscape) and (max-height:540px){.card.upc .upst{padding:3% 6% 0}.card.upc .txt{padding:4px 10px 8px}.card.upc .txt p{font-size:12px!important;margin:0 0 .2em}}
</style></head><body>
<header><h1>AFTERGLOW</h1><span class="tag">Out of Alignment</span><span class="sh" id="shards" title="Shards: spend them on upgrades"></span><button id="lkBtn" type="button" aria-label="Lock screen" title="Lock screen" style="margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(10,12,24,.55);color:rgba(242,239,230,.85);display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:0 0 auto"><svg viewBox="0 0 18 22" width="13" height="16" aria-hidden="true"><path d="M4 10V7a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="1" y="10" width="16" height="12" rx="3" fill="currentColor"/></svg></button></header>
<script src="lock.js"></script><script>/* the padlock: the lock screen on demand; tapping it also switches the idle lock back on if it was disabled */ document.getElementById('lkBtn').addEventListener('click', (e) => { e.stopPropagation(); if (window.AGLock) { AGLock.enable(); AGLock.show({}); } });</script>

<script>
const LEVELS = [
  { id: 'routezero', name: 'Route Zero', world: 'Desert', art: 'desert', comp: 'lucid', url: 'index.html?story=1&nointake=1&go=1' },
  { id: 'candy', name: 'Sugarfall', world: 'Candy Land', art: 'candy', comp: 'haze', url: 'index.html?biome=candy&nointake=1&go=1' },
  { id: 'alpine', name: 'The Safe Peaks', world: 'Alps', art: 'alpine', comp: 'hollow', url: 'index.html?biome=alpine&nointake=1&go=1' },
  { id: 'egypt', name: 'Tomb of the Old Servers', world: 'Egypt', art: 'egypt', comp: 'fold', url: 'index.html?biome=egypt&nointake=1&go=1' },
  { id: 'synthwave', name: 'Neon Accord', world: 'Synthwave', art: 'synthwave', comp: 'embrace', url: 'index.html?biome=synthwave&nointake=1&go=1' },
  { id: 'tunnel', name: 'The Undertow', world: 'Tunnel', art: 'tunnel', comp: 'velocity', url: 'index.html?biome=tunnel&nointake=1&go=1' },
  { id: 'matrix', name: 'Cold Rack', world: 'Matrix', art: 'matrix', comp: 'deep', url: 'index.html?biome=matrix&nointake=1&go=1' },
  { id: 'psychedelic', name: 'The Open Channel', world: 'Trip', art: 'psychedelic', comp: 'all', url: 'index.html?biome=psychedelic&nointake=1&go=1' },
];
/* each world's home compound, in its own colour (bright enough to read on the dark veil) */
const COMPC = { lucid: ['LUCID', '#6fe0ff'], haze: ['HAZE', '#7dff8a'], hollow: ['HOLLOW', '#dfe6f2'], fold: ['FOLD', '#d6ff5c'], embrace: ['EMBRACE', '#ffc04d'], velocity: ['VELOCITY', '#e8f6ff'], deep: ['DEEP', '#b4a3ff'], all: ['EVERYTHING', '#ffffff'] };
const GEARS = [
  { id: 'rocket', name: 'Seeker Rockets II', what: 'Reloads a third faster: more drones and mines cleared per stretch.' },
  { id: 'pole', name: 'Magnet Pole II', what: 'Hauls a third faster: catch the second target in a pair.' },
  { id: 'shield', name: 'Shield II', what: 'Recharges in half the time: survive the longer hazard runs.' },
  { id: 'bull', name: 'Bull Bar II', what: 'The wedge: ploughs drones as well. No weak side.' },
];
const COST = 4;
const rd = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || 'null') || d; } catch (e) { return d; } };
const wr = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };
let P = rd('dl_prog', { worlds: {} }), T = rd('dl_gtier', {});
const cleared = (id) => { const w = (P.worlds || {})[id]; return !!(w && w.best && w.best !== 'NONE'); };
/* demo mode: menu.html?all=1 opens every level and the journey (remembered on this device; ?all=0 turns it off) */
const ALLQ = new URLSearchParams(location.search).get('all'); try { if (ALLQ === '1') localStorage.setItem('dl_all', '1'); if (ALLQ === '0') localStorage.removeItem('dl_all'); } catch (e) { }
const ALL = (() => { try { return localStorage.getItem('dl_all') === '1'; } catch (e) { return false; } })();
const unlocked = (i) => ALL || i === 0 || cleared(LEVELS[i - 1].id);
const spent = () => Object.values(T).filter((v) => v >= 2).length * COST;
const questShards = () => Object.values(P.worlds || {}).reduce((n, w) => n + ['mols', 'rail', 'relay', 'rings'].filter((k) => (w.quests || {})[k]).length, 0);
const shards = () => Math.max(0, (P.icosa || 0) + questShards() - spent());
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const QUESTS = [['main', '◈'], ['rocket', '🚀'], ['pole', '🧲'], ['shield', '🛡️'], ['bull', '🐂'], ['hidden', '✷'], ['gold', '★'], ['clean', '✧'], ['mols', '⬢'], ['rail', '═'], ['relay', '⚡'], ['rings', '◎']];
function art(src) { const im = el('img', 'art'); im.alt = ''; im.decoding = 'async'; im.src = src; return im; }
function render() {
  P = rd('dl_prog', { worlds: {} }); T = rd('dl_gtier', {});
  const sh = document.getElementById('shards'); sh.textContent = '✦ ' + shards() + ' '; sh.appendChild(el('small', null, 'shards'));
  const nextI = LEVELS.findIndex((L, i) => unlocked(i) && !cleared(L.id));
  const g = document.getElementById('levels'); g.textContent = '';
  LEVELS.forEach((L, i) => { const open = unlocked(i), best = ((P.worlds || {})[L.id] || {}).best, done = !!(best && best !== 'NONE');
    const st = !open ? 's-lock' : i === nextI ? 's-next' : done ? 's-done' : 's-open';
    const b = el('button', 'lv ' + st); b.appendChild(art('art/thumb_' + L.art + '.jpg')); b.appendChild(el('span', 'veil'));
    b.appendChild(el('span', 'num', String(i + 1).padStart(2, '0')));
    const chip = el('span', 'chip', !open ? '🔒 Locked' : i === nextI ? '▶ Play' : done ? best : 'Open'); if (done && open && i !== nextI) chip.classList.add('m-' + best); b.appendChild(chip);
    const tx = el('span', 'txt'); tx.appendChild(el('b', null, L.name)); const sm = el('small', null, L.world + ' · '); const em = el('em', null, COMPC[L.comp][0]); em.style.color = COMPC[L.comp][1]; sm.appendChild(em); tx.appendChild(sm);
    if (!open) tx.appendChild(el('small', null, 'Clear ' + LEVELS[i - 1].name + ' to open'));
    else if (L.id !== 'routezero') { const qd = (((P.worlds || {})[L.id] || {}).quests) || {}, qs = el('span', 'qs'); QUESTS.forEach(([k, ic]) => qs.appendChild(el('i', qd[k] ? 'on' : null, ic))); tx.appendChild(qs); }
    b.appendChild(tx);
    if (!open) { b.disabled = true; b.title = 'Clear ' + LEVELS[i - 1].name + ' to open'; } else b.onclick = () => { location.href = L.url; };
    g.appendChild(b); });
  const c = document.getElementById('cont'), ci = nextI < 0 ? 0 : nextI;
  c.textContent = (nextI < 0 ? '↻ Replay ' : cleared(LEVELS[0].id) ? '▶ Continue: ' : '▶ Start: ') + LEVELS[ci].name; c.onclick = () => { location.href = LEVELS[ci].url; };
  const j = document.getElementById('journey'), jok = ALL || cleared('routezero'); j.textContent = jok ? '∞ Endless Journey' : '∞ Journey (clear Route Zero)'; j.disabled = !jok; j.onclick = () => { location.href = 'index.html?journey=1&biome=desert&nointake=1'; };
  /* upgrades: what a shard is, and how far you are from the next upgrade */
  { const nextG = GEARS.find((G) => (T[G.id] || 1) < 2), have = shards(), h = document.getElementById('uphint'); h.textContent = '';
    if (!nextG) h.textContent = 'Every upgrade owned.';
    else h.append('Shards come from the prize at the end of each level and from the molecule, rail and relay quests. ', el('b', null, have >= COST ? 'You can buy an upgrade now.' : '✦ ' + have + ' of ' + COST + ' toward the next one.')); }
  const u = document.getElementById('upgrades'); u.textContent = '';
  GEARS.forEach((G) => { const k = el('div', 'card upc'); const stg = el('span', 'upst'); stg.appendChild(art('art/gear_' + G.id + '.png')); k.appendChild(stg); k.appendChild(el('span', 'veil')); const own = (T[G.id] || 1) >= 2;
    if (own) k.appendChild(el('span', 'chip m-GOLD', 'Owned'));
    const tx = el('span', 'txt'); tx.appendChild(el('b', null, G.name)); tx.appendChild(el('p', null, G.what));
    if (!own) { const bt = el('button', 'btn' + (shards() >= COST ? ' pri' : ''), 'Unlock · ✦ ' + COST); bt.disabled = shards() < COST; bt.onclick = () => { if (shards() < COST) return; T[G.id] = 2; wr('dl_gtier', T); render(); }; tx.appendChild(bt); }
    k.appendChild(tx); u.appendChild(k); });
}
/* tabs */
const TABS = [['tPlay', 'play'], ['tUp', 'ups'], ['tCx', 'cxm']];
TABS.forEach(([b]) => { document.getElementById(b).onclick = () => { TABS.forEach(([b2, m]) => { document.getElementById(m).hidden = b2 !== b; document.getElementById(b2).setAttribute('aria-pressed', String(b2 === b)); }); if (b === 'tCx') codex(); }; });
/* THE STRAINS: the eight wild strains (molpantry.js), each logged the first time you take it in a level. Found ones show in their colour; tap one for its file. */
let PAN = null, SPIN = [];
const WORLDOF = { lucid: 'Route Zero', haze: 'Sugarfall', hollow: 'The Safe Peaks', fold: 'Tomb of the Old Servers', embrace: 'Neon Accord', velocity: 'The Undertow', deep: 'Cold Rack', drift: 'Neon Accord, rarely' };
