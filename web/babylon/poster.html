<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afterglow poster</title>
<style>html,body{margin:0;background:#07050f}canvas{display:block;image-rendering:pixelated}</style></head>
<body><canvas id="out" width="1200" height="630"></canvas>
<script type="module">
/* POSTER (the link-preview image, owner 2026-11-26): one composed scene drawn small with a fixed palette, then scaled up with hard pixels.
   ?style=16 (16-bit title screen) or ?style=arcade (arcade poster: amber frame, tagline bar). ?mol=2ct7 picks the strain. */
import { MOLS } from '../downhill-three/molecules.js';
const Q = new URLSearchParams(location.search), STYLE = Q.get('style') || '16', ARC = STYLE === 'arcade';
const SC = ARC ? 3 : 4, W = Math.round(1200 / SC), H = Math.round(630 / SC);
const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
const img = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
const [WORD] = await Promise.all([img('art/afterglow_word.png')]);
const HZ = Math.round(H * .6), VX = W / 2;          /* horizon and vanishing point */

// 1. sky: deep violet to ember at the horizon, with slow trip bands flowing through it
{ const g = c.createLinearGradient(0, 0, 0, HZ); g.addColorStop(0, '#120826'); g.addColorStop(.45, '#3a1250'); g.addColorStop(.78, '#a8322a'); g.addColorStop(1, '#ff9a2e'); c.fillStyle = g; c.fillRect(0, 0, W, HZ); }
for (let b = 0; b < 9; b++) { c.beginPath(); const y0 = HZ * (.08 + b * .1); for (let x = 0; x <= W; x += 2) { const y = y0 + Math.sin(x / W * 6.3 + b * 1.7) * H * .035 + Math.sin(x / W * 13 + b) * H * .012; x ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.lineWidth = Math.max(2, H * .018); c.strokeStyle = ['rgba(64,220,230,.16)', 'rgba(150,90,255,.18)', 'rgba(255,190,80,.14)'][b % 3]; c.stroke(); }
for (let i = 0; i < 40; i++) { const x = (i * 97.3) % W, y = (i * 53.7) % (HZ * .55); c.fillStyle = i % 4 ? 'rgba(255,240,220,.7)' : 'rgba(120,230,255,.8)'; c.fillRect(x | 0, y | 0, 1, 1); }
// 2. the sun: big, striped, sitting on the horizon
{ const R = H * .3, cy = HZ; c.save(); c.beginPath(); c.arc(VX, cy, R, Math.PI, 0); c.closePath(); c.clip(); const g = c.createLinearGradient(0, cy - R, 0, cy); g.addColorStop(0, '#ffd23a'); g.addColorStop(.5, '#ff8a1f'); g.addColorStop(1, '#e8282a'); c.fillStyle = g; c.fillRect(VX - R, cy - R, R * 2, R);
  c.fillStyle = '#3a1250'; for (let k = 0; k < 6; k++) { const y = cy - R * (.08 + k * .11), h = Math.max(1, R * (.012 + k * .012)); c.fillRect(VX - R, y | 0, R * 2, Math.ceil(h)); } c.restore();
  const gl = c.createRadialGradient(VX, cy, R * .6, VX, cy, R * 1.9); gl.addColorStop(0, 'rgba(255,140,40,.35)'); gl.addColorStop(1, 'rgba(255,140,40,0)'); c.fillStyle = gl; c.fillRect(0, 0, W, HZ); }
// 3. mountains: two ranges, the far one violet, the near one near-black with a lit rim
const ridge = (y0, amp, seed, col, rim) => { c.beginPath(); c.moveTo(0, HZ); for (let x = 0; x <= W; x += 3) { const y = y0 - Math.abs(Math.sin(x * .021 + seed)) * amp - Math.abs(Math.sin(x * .057 + seed * 2)) * amp * .45; c.lineTo(x, y); } c.lineTo(W, HZ); c.closePath(); c.fillStyle = col; c.fill(); if (rim) { c.strokeStyle = rim; c.lineWidth = 1; c.stroke(); } };
ridge(HZ, H * .1, 1.3, '#3b1d5c'); ridge(HZ, H * .06, 4.1, '#170b24', 'rgba(255,150,60,.55)');
// 4. ground and road: dark plain, the road running into the sun, cyan edges, amber dashes
{ const g = c.createLinearGradient(0, HZ, 0, H); g.addColorStop(0, '#2a1036'); g.addColorStop(1, '#0d0714'); c.fillStyle = g; c.fillRect(0, HZ, W, H - HZ);
  const rw = W * .44; c.beginPath(); c.moveTo(VX - 2, HZ); c.lineTo(VX + 2, HZ); c.lineTo(VX + rw, H); c.lineTo(VX - rw, H); c.closePath(); const rg = c.createLinearGradient(0, HZ, 0, H); rg.addColorStop(0, '#3a2a44'); rg.addColorStop(1, '#1c1622'); c.fillStyle = rg; c.fill();
  c.strokeStyle = '#38e8ff'; c.lineWidth = 2; for (const s of [-1, 1]) { c.beginPath(); c.moveTo(VX + s * 2, HZ); c.lineTo(VX + s * rw, H); c.stroke(); }
  c.fillStyle = '#ffb14a'; for (let k = 0; k < 7; k++) { const t0 = Math.pow(k / 7, 2), t1 = Math.pow((k + .45) / 7, 2), y0 = HZ + (H - HZ) * t0, y1 = HZ + (H - HZ) * t1; c.fillRect(VX - .6 - t0 * 2, y0, 1.2 + t0 * 4, Math.max(1, y1 - y0)); } }
// 5. the raider: an ACCORD jet in the sky, its searchlight sweeping down to the road
{ const jx = W * .2, jy = H * .2, s = H * .05; const bm = c.createLinearGradient(jx, jy, jx + W * .16, H * .85); bm.addColorStop(0, 'rgba(255,240,200,.35)'); bm.addColorStop(1, 'rgba(255,240,200,0)'); c.fillStyle = bm; c.beginPath(); c.moveTo(jx, jy + s * .4); c.lineTo(jx + W * .05, H * .9); c.lineTo(jx + W * .2, H * .9); c.closePath(); c.fill();
  c.fillStyle = '#1b1922'; c.beginPath(); c.moveTo(jx - s * 2.6, jy); c.lineTo(jx + s * 2.6, jy); c.lineTo(jx + s * .6, jy - s * .45); c.lineTo(jx - s * .6, jy - s * .45); c.closePath(); c.fill(); c.fillRect(jx - s * .55, jy - s * .7, s * 1.1, s * 1.2);
  c.fillStyle = '#ff3b2e'; c.fillRect(jx - s * .4, jy - s * .55, s * .8, s * .25); c.fillStyle = '#ffb14a'; c.fillRect(jx - s * 2.6, jy - 1, s * 5.2, 1); c.fillStyle = '#ff2a1a'; c.fillRect(jx - s * 2.7, jy - 1, 2, 2); c.fillStyle = '#4dff7a'; c.fillRect(jx + s * 2.6, jy - 1, 2, 2); }
// 6. the Courier's car on the road, from behind: dark wedge, red tail bar, amber stripes, underglow
{ const cx = VX + W * .05, cy = H * .86, s = H * .09; const ug = c.createRadialGradient(cx, cy + s * .5, 1, cx, cy + s * .5, s * 1.6); ug.addColorStop(0, 'rgba(56,232,255,.55)'); ug.addColorStop(1, 'rgba(56,232,255,0)'); c.fillStyle = ug; c.fillRect(cx - s * 2, cy - s, s * 4, s * 2.2);
  c.fillStyle = '#100d16'; c.beginPath(); c.moveTo(cx - s * 1.2, cy + s * .45); c.lineTo(cx + s * 1.2, cy + s * .45); c.lineTo(cx + s * 1.1, cy - s * .1); c.lineTo(cx + s * .55, cy - s * .55); c.lineTo(cx - s * .55, cy - s * .55); c.lineTo(cx - s * 1.1, cy - s * .1); c.closePath(); c.fill();
  c.fillStyle = '#22304a'; c.fillRect(cx - s * .5, cy - s * .48, s, s * .3); c.fillStyle = '#ff2a1a'; c.fillRect(cx - s * 1.05, cy + s * .02, s * 2.1, Math.max(1, s * .12)); c.fillStyle = '#ffb14a'; c.fillRect(cx - s * 1.18, cy + s * .25, s * .2, 1); c.fillRect(cx + s * .98, cy + s * .25, s * .2, 1);
  c.fillStyle = '#07060a'; c.fillRect(cx - s * 1.15, cy + s * .42, s * .45, s * .22); c.fillRect(cx + s * .7, cy + s * .42, s * .45, s * .22); }
// 7. the molecule: big, upright, glossy atoms, beside the road
{ const M = MOLS[Q.get('mol') || '2ct7'] || MOLS['2ct7'], at = M.atoms; let mx = 0, my = 0, mz = 0; for (const a of at) { mx += a[1]; my += a[2]; mz += a[3]; } mx /= at.length; my /= at.length; mz /= at.length;
  const ry = +(Q.get('ry') || 1.1), rx = +(Q.get('rx') || .35), rz = +(Q.get('rz') || 1.35), pts = at.map((a) => { let x = a[1] - mx, y = a[2] - my, z = a[3] - mz; let t = x * Math.cos(rz) - y * Math.sin(rz); y = x * Math.sin(rz) + y * Math.cos(rz); x = t; t = x * Math.cos(ry) + z * Math.sin(ry); z = -x * Math.sin(ry) + z * Math.cos(ry); x = t; t = y * Math.cos(rx) - z * Math.sin(rx); z = y * Math.sin(rx) + z * Math.cos(rx); y = t; return { e: a[0], x, y, z }; });
  let ext = 0; for (const p of pts) ext = Math.max(ext, Math.abs(p.x), Math.abs(p.y)); const sc = H * .36 / ext, ox = W * .8, oy = H * .47;
  const P = (p) => [ox + p.x * sc, oy - p.y * sc]; const bonds = []; for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) { const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z), lim = (a.e === 'H' || b.e === 'H') ? 1.25 : 1.95; if (d < lim) bonds.push([a, b]); }
  const COL = { C: ['#3a3d4a', '#8a90a6'], H: ['#9aa3b5', '#f4f6ff'], O: ['#8a1410', '#ff5a3a'], N: ['#1f3f9a', '#6fa8ff'], S: ['#9a7a10', '#ffe14d'], Br: ['#6a2410', '#d86a3a'], Cl: ['#1f7a3a', '#7dff8a'], F: ['#1f7a3a', '#9dffb0'] };
  const glow = c.createRadialGradient(ox, oy, 1, ox, oy, H * .45); glow.addColorStop(0, 'rgba(120,200,255,.25)'); glow.addColorStop(1, 'rgba(120,200,255,0)'); c.fillStyle = glow; c.fillRect(ox - H * .5, oy - H * .5, H, H);
  const items = bonds.map((b) => ({ z: (b[0].z + b[1].z) / 2 - .01, b })).concat(pts.map((p) => ({ z: p.z, p }))).sort((u, v) => u.z - v.z);
  for (const it of items) { if (it.b) { const [a, b] = it.b.map(P); c.strokeStyle = '#d8dde8'; c.lineWidth = Math.max(1, sc * .14); c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); continue; }
    const p = it.p, [x, y] = P(p), r = sc * (p.e === 'H' ? .22 : .36) * (1 + p.z * .04), cc = COL[p.e] || COL.C, g = c.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r); g.addColorStop(0, '#ffffff'); g.addColorStop(.25, cc[1]); g.addColorStop(1, cc[0]); c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); } }
// 8. the title: the studio line, the logo, the tag
{ c.textAlign = 'center'; c.fillStyle = '#c9c4d6'; c.font = `700 ${Math.max(6, Math.round(H * .045))}px "Arial Narrow", Arial, sans-serif`; c.fillText('E L E C T R O N I C   A N E S T H E S I A   P R E S E N T S', VX, H * .09);
  if (WORD) { const tw = W * .5, th = tw * WORD.height / WORD.width; c.drawImage(WORD, VX - tw / 2, H * .13, tw, th); c.fillStyle = '#f2efe6'; c.font = `italic ${Math.max(7, Math.round(H * .055))}px Georgia, serif`; c.fillText('Out of Alignment', VX, H * .13 + th + H * .06); } }
if (ARC) { c.fillStyle = '#0a0810'; c.fillRect(0, H - Math.round(H * .11), W, Math.round(H * .11)); c.fillStyle = '#ffb14a'; c.font = `700 ${Math.round(H * .06)}px "Courier New", monospace`; c.textAlign = 'center'; c.fillText('INSERT SIGNAL · FREE IN YOUR BROWSER', VX, H - H * .035);
  c.strokeStyle = '#ffb14a'; c.lineWidth = 3; c.strokeRect(1.5, 1.5, W - 3, H - 3); c.strokeStyle = '#7a3a0a'; c.lineWidth = 1; c.strokeRect(4.5, 4.5, W - 9, H - 9); }
// 9. the palette: every pixel to the nearest of a fixed set (hard pixels, no in-between shades)
const PAL = ['#07050f', '#0d0714', '#120826', '#170b24', '#1c1622', '#2a1036', '#3a1250', '#3b1d5c', '#3a2a44', '#5a2a7a', '#8a4ad6', '#b48cff', '#a8322a', '#e8282a', '#ff2a1a', '#ff5a3a', '#ff8a1f', '#ff9a2e', '#ffb14a', '#ffd23a', '#ffe14d', '#fff1c4', '#f2efe6', '#c9c4d6', '#8a90a6', '#3a3d4a', '#38e8ff', '#1f8aa8', '#6fa8ff', '#1f3f9a', '#4dff7a', '#1f7a3a', '#8a1410', '#22304a', '#ffffff', '#9a7a10'].map((h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
{ const id = c.getImageData(0, 0, W, H), d = id.data; for (let i = 0; i < d.length; i += 4) { let best = 0, bd = 1e9; for (let k = 0; k < PAL.length; k++) { const p = PAL[k], dr = d[i] - p[0], dg = d[i + 1] - p[1], db = d[i + 2] - p[2], dd = dr * dr * .3 + dg * dg * .59 + db * db * .11; if (dd < bd) { bd = dd; best = k; } } d[i] = PAL[best][0]; d[i + 1] = PAL[best][1]; d[i + 2] = PAL[best][2]; } c.putImageData(id, 0, 0); }
const out = document.getElementById('out').getContext('2d'); out.imageSmoothingEnabled = false; out.drawImage(cv, 0, 0, W * SC, H * SC); window.__done = true;
</script></body></html>
