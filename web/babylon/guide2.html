const pips = (n) => '<i class="pp">' + [1, 2, 3, 4, 5].map((i) => '<u' + (i <= n ? ' class="on"' : '') + '></u>').join('') + '</i>';
const row = (th, b, span, soon, cls, o) => '<button type="button" class="it' + (cls ? ' ' + cls : '') + '" data-k="' + reg(o) + '">' + th + '<div><b>' + esc(b) + (soon ? SOON : '') + '</b>' + (span ? '<span>' + esc(span) + '</span>' : '') + (o.e && o.e.threat ? '<small>Threat ' + pips(o.e.threat) + '</small>' : '') + '</div><i class="go">\u203A</i></button>';
const thImg = (src) => '<div class="th" style="background-image:url(\'' + src + '\')"></div>', thTx = (t) => '<div class="th">' + t + '</div>';
const sec = (h, inner) => inner ? '<div class="sec"><h4>' + h + '</h4>' + inner + '</div>' : '';
const CX = window.AGCODEX || { E: {}, X: {}, K: {} };
document.getElementById('toc').innerHTML = D.map((d) => '<a href="#' + d.w + '">' + esc(d.name) + '</a>').join('');
document.getElementById('dests').innerHTML = D.map((d) => {
  const hero = 'guide/hero-' + d.w + '.jpg';
  const wild = d.wild.map(([n, t, s]) => { const img = n === '__skit' ? 'guide/hero-skitters.jpg' : P(n); return row(thImg(img), t, s, 0, '', { t, w: d, e: CX.E[t], img, line: s }); }).join('');
  const air = row(thImg('guide/hero-raid-' + d.w + '.jpg'), d.air[0], d.air[1], 0, '', { t: d.air[0], w: d, e: CX.E[d.air[0]], line: d.air[1] });
  const fl = d.flora ? row('<div class="th" style="background:#f4ecd8">' + PL(d.flora[0]) + '</div>', d.flora[1], d.flora[2].split(':')[0], 0, '', { t: d.flora[1], w: d, e: CX.E[d.flora[1]], line: d.flora[2] }) : '';
  const dos = d.do.map(([ic, t, s, tip]) => row(thTx(ic), t, s, 0, '', { t, w: d, ic, line: s, tip, kind: 'do' })).join('');
  const haz = d.haz.map(([t, s, soon]) => row(thTx('!'), t, null, soon, 'haz', { t, w: d, ic: '!', line: s, kind: 'haz', soon })).join('');
  const loc = d.loc.map(([ic, t, s, soon]) => row(thTx(ic), t, null, soon, '', { t, w: d, ic, line: s, kind: 'loc', soon })).join('');
  return '<section class="dest w-' + d.w + '" id="' + d.w + '"><div class="hero" style="background-image:url(\'' + hero + '\'),url(\'guide/dest-' + d.w + '.jpg\')"><div class="cap"><small>' + esc(d.kick) + '</small><h2>' + esc(d.name) + '</h2><p>' + esc(d.hook) + '</p></div></div>'
    + '<div class="feat"><h3>Featured: ' + esc(d.feat[0]) + (d.feat[2] ? SOON : '') + '</h3><p>' + esc(d.feat[1]) + '</p><div><a class="drive" href="index.html?' + (d.w === 'desert' ? 'story=1' : 'biome=' + d.w) + '&amp;nointake=1">\u25B6 Drive ' + esc(d.name) + '</a></div></div>'
    + '<div class="cols"><div>' + sec('Things to do', dos) + sec('Wildlife you may meet', wild) + '</div><div>' + sec('Overhead', air) + sec('Local flora', fl) + sec('When in ' + d.name + ', beware', haz) + sec('Locals', loc) + '</div></div></section>'; }).join('');
/* THE PROFILE PAGE: picture, meters, how it hurts you, how to beat it, then the reading */
const sheet = document.getElementById('sheet'), sbody = sheet.querySelector('.sb');
const bar = (lab, n, max, note) => '<div class="mt"><span>' + lab + '</span><b><i style="width:' + Math.round(100 * Math.max(0, Math.min(max, n)) / max) + '%"></i></b><em>' + note + '</em></div>';
const WORD = { 0: 'none', 1: 'low', 2: 'some', 3: 'fair', 4: 'high', 5: 'extreme' };
function openSheet(id) { const o = REG[id]; if (!o) return; const e = o.e, x = CX.X[o.t] || {}, w = o.w; let h = '';
  const pic = (e && e.img) || o.img, plant = e && e.kind === 'flora' ? PL(e.plant) : '';
  h += '<div class="pf' + (pic || plant ? '' : ' nopic') + '">' + (pic ? '<div class="pi" style="background-image:url(\'' + pic + '\')"></div>' : plant ? '<div class="pi pl">' + plant + '</div>' : '<div class="pi ic">' + esc(o.ic || '\u25C8') + '</div>')
    + '<div class="ph"><small>' + esc(w.name) + ' \u00B7 ' + esc((e && e.cls) || ({ do: 'Thing to do', haz: 'Local hazard', loc: 'Local' })[o.kind] || '') + '</small><h3>' + esc(o.t) + (o.soon ? SOON : '') + '</h3><p>' + esc(o.line) + '</p></div></div>';
  if (e && (e.kind === 'machine' || e.kind === 'raider')) {
    h += '<div class="mts">' + bar('Threat', e.threat, 5, WORD[e.threat]) + bar('Toughness', e.hp, 9, e.hp === 1 ? 'one hit' : e.hp + ' hits') + bar('Speed', e.spd, 5, WORD[e.spd]) + bar('Hits you', e.dmg, 5, WORD[e.dmg]) + bar('Numbers', e.num, 5, e.num === 1 ? 'alone' : e.num >= 5 ? 'swarm' : e.num === 2 ? 'a pair' : 'a few') + '</div>';
    h += '<div class="kb"><span>Beaten by</span>' + e.kills.map((k) => '<i>' + esc(CX.K[k] || ({ ZAP: 'Zappers', STORM: 'Thunder clouds' })[k] || k) + '</i>').join('') + '</div>';
    h += '<dl><dt>How it comes at you</dt><dd>' + esc(e.attack) + '</dd><dt>What it does to you</dt><dd>' + esc(e.toYou) + '</dd><dt class="hot">How to beat it</dt><dd class="hot">' + esc(e.beat) + '</dd></dl>';
    h += '<dl class="lore"><dt>Origin</dt><dd>' + esc(e.story) + '</dd><dt>Diet</dt><dd>' + esc(e.diet) + '</dd><dt>Life cycle</dt><dd>' + esc(e.life) + '</dd><dt>Habitat</dt><dd>' + esc(e.habitat) + '</dd><dt>Little-known fact</dt><dd>' + esc(e.fact) + '</dd></dl>';
    if (e.quote) h += '<blockquote>' + esc(e.quote) + '</blockquote>';
  } else if (e && e.kind === 'flora') {
    h += '<dl><dt class="hot">What it gives you</dt><dd class="hot">' + esc(e.gives) + '</dd><dt>Where to find it</dt><dd>' + esc(e.find) + '</dd></dl><dl class="lore"><dt>Origin</dt><dd>' + esc(e.story) + '</dd><dt>Life cycle</dt><dd>' + esc(e.life) + '</dd><dt>Little-known fact</dt><dd>' + esc(e.fact) + '</dd></dl>';
  } else {
    h += '<dl>' + (o.tip ? '<dt class="hot">Tip</dt><dd class="hot">' + esc(o.tip) + '</dd>' : '') + (x.story ? '<dt>Who they are</dt><dd>' + esc(x.story) + '</dd>' : '') + (x.fact ? '<dt>Little-known fact</dt><dd>' + esc(x.fact) + '</dd>' : '') + (o.soon ? '<dt>Status</dt><dd>Not in the game yet. Opening soon.</dd>' : '') + '</dl>';
  }
  sbody.innerHTML = h; sheet.hidden = false; sheet.scrollTop = 0; document.body.classList.add('lock'); try { history.pushState({ sh: 1 }, ''); } catch (er) { } }
function closeSheet(fromPop) { if (sheet.hidden) return; sheet.hidden = true; document.body.classList.remove('lock'); if (!fromPop) try { history.back(); } catch (er) { } }
document.getElementById('dests').addEventListener('click', (e) => { const b = e.target.closest('.it[data-k]'); if (b) openSheet(b.dataset.k); });
sheet.querySelector('.sx').onclick = () => closeSheet(); sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });
addEventListener('popstate', () => closeSheet(true)); addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
document.getElementById('toTop').addEventListener('click', (e) => { e.preventDefault(); scrollTo({ top: 0, behavior: 'smooth' }); });
{ const Q = new URLSearchParams(location.search), inFrame = window.top !== window || Q.has('inframe'), back = Q.get('back');
  document.getElementById('tgClose').addEventListener('click', (e) => { e.preventDefault(); if (inFrame) { try { window.parent.postMessage({ tg: 'close' }, '*'); } catch (er) { } return; } if (back && /^[\w.\-\/?=&%]+$/.test(back)) { location.href = back; return; } try { if (document.referrer && new URL(document.referrer).origin === location.origin) { history.back(); return; } } catch (er) { } location.href = 'splash.html'; });
  if (inFrame) for (const a of document.querySelectorAll('a.drive, .bar a.go, .mast a')) a.target = '_top'; }
