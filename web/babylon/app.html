<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Afterglow</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070c">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Afterglow">
<link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="icon" href="icons/icon-192.png">
<style>
/* THE SHELL: the game's one page. Every other page (menu, levels, the Dial, the character, the Music Lab) runs inside it, so going fullscreen once
   lasts for the whole session (a browser always leaves fullscreen when the top page changes). Also the start page of the installed app. */
html, body { margin:0; height:100%; background:#05070c; overflow:hidden; }
iframe { position:fixed; left:0; top:0; width:100%; height:100%; height:100dvh; border:0; display:block; background:#05070c; }          /* (the visible screen, windowed or fullscreen: a phone's address bar never hides the bottom of the page) */
</style></head><body>
<iframe id="f" title="Afterglow" allow="fullscreen; camera; microphone; autoplay; gyroscope; accelerometer; xr-spatial-tracking; clipboard-write" allowfullscreen></iframe>
<script>
window.__SHELL = true; window.__fsAt = -1e9; for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) document.addEventListener(ev, () => { if (document.fullscreenElement || document.webkitFullscreenElement) window.__fsAt = performance.now(); });          /* (when fullscreen began: phone browsers show an exit notice for a few seconds, and pages keep their buttons clear of it) */          /* the pages look for this: inside the shell they fullscreen the shell itself */
(() => { const f = document.getElementById('f'), q = new URLSearchParams(location.search); let p = q.get('p') || 'splash.html';          /* the title screen first; it taps through to the menu */
  if (!/^[A-Za-z0-9_-]+\.html([?#].*)?$/.test(p)) p = 'menu.html';          /* only this folder's own pages */
  f.src = p;
  /* the address bar follows the page inside, so a reload or a bookmark lands back on it */
  f.addEventListener('load', () => { try { const L = f.contentWindow.location, page = L.pathname.split('/').pop() + L.search + L.hash; if (/^[A-Za-z0-9_-]+\.html/.test(page)) history.replaceState(null, '', 'app.html?p=' + encodeURIComponent(page)); document.title = f.contentDocument.title || 'Afterglow'; f.contentWindow.focus(); } catch (e) { } });
  /* THE CAMERA HOLE: env(safe-area-inset-*) is only known to the top page, so the shell measures it and gives it to the page inside as --sa-top/right/bottom/left
     (the pages use var(--sa-left, env(safe-area-inset-left)), so they also work on their own). Measured again on every turn, resize and fullscreen change. */
  const probe = document.createElement('div'); probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)'; document.body.appendChild(probe);
  const insets = () => { try { const cs = getComputedStyle(probe), r = f.contentDocument && f.contentDocument.documentElement; if (!r) return; for (const k of ['top', 'right', 'bottom', 'left']) r.style.setProperty('--sa-' + k, cs['padding' + k[0].toUpperCase() + k.slice(1)]); } catch (e) { } };
  f.addEventListener('load', insets); for (const ev of ['resize', 'orientationchange', 'fullscreenchange', 'webkitfullscreenchange']) addEventListener(ev, () => { insets(); setTimeout(insets, 300); });
  try { screen.orientation && screen.orientation.addEventListener('change', () => setTimeout(insets, 300)); } catch (e) { } setInterval(insets, 2000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });          /* makes it installable (Add to Home Screen); it caches nothing */
  /* UPDATES: every deploy writes version.txt. When the app comes back into view and the version has changed, a page that's just sitting there (title, menu,
     glossary...) reloads itself, so nobody stays behind on an old build. The game itself is never reloaded mid-run: leaving it loads the new build anyway
     (pages and scripts are served no-cache, so every load checks for a newer copy). */
  let VER = null; const chk = async () => { try { const v = (await (await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })).text()).trim(); if (!v) return; if (VER === null) { VER = v; return; }
    if (v !== VER) { VER = v; const page = f.contentWindow.location.pathname.split('/').pop(); if (page !== 'index.html') f.contentWindow.location.reload(); } } catch (e) { } };
  chk(); document.addEventListener('visibilitychange', () => { if (!document.hidden) chk(); }); addEventListener('focus', chk);
})();
</script>
</body></html>
